<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Billing</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        .mic-btn { background: #ff4757; color: white; border: none; width: 80px; height: 80px; border-radius: 50%; font-size: 32px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); transition: 0.3s; margin: 15px 0; }
        .mic-btn.recording { animation: pulse 1.2s infinite; background: #2ed573; box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .btn-demo { background: #f7b731; color: #2d3436; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; font-size: 14px; }
        #status { color: #2e86de; font-weight: 600; margin: 10px 0; min-height: 24px; font-size: 14px; }
        #live-text { background: #f1f2f6; padding: 10px; border-radius: 8px; margin: 10px 0; font-style: italic; color: #57606f; display: none; font-size: 13px; word-break: break-word; }
        
        /* Receipt Bill Formatting */
        .bill-receipt { background: #fff; border: 1px dashed #b2bec3; padding: 20px; border-radius: 12px; text-align: left; margin-top: 20px; font-family: monospace; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .bill-header { text-align: center; border-bottom: 2px dashed #2d3436; padding-bottom: 10px; margin-bottom: 12px; }
        .bill-header h3 { margin: 0; color: #2d3436; font-size: 18px; font-family: 'Segoe UI', sans-serif; }
        .bill-customer { margin-bottom: 10px; font-weight: bold; color: #0984e3; }
        .bill-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        .bill-table th, .bill-table td { padding: 6px 0; border-bottom: 1px solid #f1f2f6; text-align: left; }
        .bill-table th { font-weight: bold; color: #636e72; }
        .text-right { text-align: right !important; }
        .bill-total { border-top: 2px dashed #2d3436; padding-top: 10px; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; color: #2d3436; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎤 Voice Billing</h2>
    <p style="color: #636e72; font-size: 14px;">लाल बटन दबाएं, बोलें और दोबारा दबाकर बंद करें</p>

    <button id="micBtn" class="mic-btn">🎤</button>
    <div id="status">बटन दबाकर बोलना शुरू करें</div>
    <div id="live-text"></div>

    <button id="demoBtn" class="btn-demo">⚡ बिना माइक के टेस्ट करें (Demo)</button>

    <div id="result" style="display:none;"></div>
</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const demoBtn = document.getElementById('demoBtn');
    const statusText = document.getElementById('status');
    const liveTextDiv = document.getElementById('live-text');
    const resultDiv = document.getElementById('result');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Duplicate Words Cleanup Function
    function cleanTranscript(text) {
        return text.replace(/\b(\w+)\b(?:\s+\1)+/gi, '$1')
                   .replace(/(kilo|kg|लीटर|ग्राम|लीटर|शक्कर|आटा|मैदा)\s+\1+/gi, '$1');
    }

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.continuous = true;
        recognition.interimResults = false; // केवल फाइनल वर्ड लेगा ताकि रिपीट न हो

        let isRecording = false;
        let finalTranscript = '';

        micBtn.onclick = () => {
            if (!isRecording) {
                finalTranscript = '';
                liveTextDiv.innerText = '';
                liveTextDiv.style.display = 'block';
                resultDiv.style.display = 'none';
                
                try {
                    recognition.start();
                    micBtn.classList.add('recording');
                    statusText.innerText = "सुन रहा हूँ... बोलना खत्म करके बटन दोबारा दबाएं!";
                    isRecording = true;
                } catch (e) {
                    console.error(e);
                }
            } else {
                recognition.stop();
                micBtn.classList.remove('recording');
                isRecording = false;
                statusText.innerText = "प्रोसेस हो रहा है...";
            }
        };

        recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + ' ';
                }
            }
            const cleanedText = cleanTranscript(finalTranscript);
            liveTextDiv.innerText = "आपकी आवाज़: " + cleanedText;
        };

        recognition.onend = () => {
            micBtn.classList.remove('recording');
            if (isRecording) {
                isRecording = false;
            }
            if (finalTranscript.trim().length > 0) {
                processText(cleanTranscript(finalTranscript));
            }
        };

        recognition.onerror = (event) => {
            if (event.error !== 'no-speech') {
                statusText.innerText = "माइक एरर: " + event.error;
                micBtn.classList.remove('recording');
                isRecording = false;
            }
        };

    } else {
        statusText.innerText = "आपका ब्राउज़र सपोर्ट नहीं करता। Android Chrome का इस्तेमाल करें।";
    }

    // Demo Button
    demoBtn.onclick = () => {
        processText("रमेश कुमार के नाम 1 किलो आटा 4 किलो मैदा 6 किलो शक्कर बिल करना");
    };

    // Process Text & Generate HTML Receipt Table
    async function processText(text) {
        statusText.innerText = "बिल बनाया जा रहा है... ⏳";
        try {
            const response = await fetch('/api/test-billing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const resData = await response.json();
            
            if (resData.success) {
                statusText.innerText = "बिल बनकर तैयार है! 🎉";
                resultDiv.style.display = 'block';
                
                let data = resData.data;
                
                let htmlReceipt = `
                    <div class="bill-receipt">
                        <div class="bill-header">
                            <h3>🧾 किराना स्टोर - रसीद</h3>
                        </div>
                        <div class="bill-customer">
                            👤 ग्राहक: ${data.customer_name || 'नकद (Cash)'}
                        </div>
                        <table class="bill-table">
                            <thead>
                                <tr>
                                    <th>सामान</th>
                                    <th>मात्रा</th>
                                    <th class="text-right">दर</th>
                                    <th class="text-right">कुल</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                data.items.forEach(item => {
                    htmlReceipt += `
                        <tr>
                            <td>${item.item_name}</td>
                            <td>${item.quantity} ${item.unit}</td>
                            <td class="text-right">₹${item.rate}</td>
                            <td class="text-right">₹${item.total}</td>
                        </tr>
                    `;
                });

                htmlReceipt += `
                            </tbody>
                        </table>
                        <div class="bill-total">
                            <span>कुल योग (Grand Total):</span>
                            <span>₹${data.grand_total}</span>
                        </div>
                    </div>
                `;
                
                resultDiv.innerHTML = htmlReceipt;
            } else {
                statusText.innerText = "प्रोसेसिंग एरर!";
            }
        } catch (e) {
            statusText.innerText = "सर्वर एरर!";
        }
    }
</script>

</body>
</html>
