<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Billing</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .mic-btn { background: #ff4757; color: white; border: none; width: 80px; height: 80px; border-radius: 50%; font-size: 32px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); transition: 0.3s; margin: 20px 0; }
        .mic-btn.recording { animation: pulse 1.2s infinite; background: #2ed573; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .btn-demo { background: #eccc68; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        #status { color: #2e86de; font-weight: bold; margin: 10px 0; min-height: 24px; }
        #live-text { background: #f1f2f6; padding: 10px; border-radius: 8px; margin: 10px 0; font-style: italic; color: #555; display: none; }
        #result { background: #e8f5e9; padding: 15px; border-radius: 10px; text-align: left; margin-top: 15px; font-size: 14px; white-space: pre-wrap; border: 1px solid #c8e6c9; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎤 Voice Billing</h2>
    <p>लाल बटन दबाएं, बोलें और फिर बंद करें</p>

    <button id="micBtn" class="mic-btn">🎤</button>
    <div id="status">बटन दबाकर बोलना शुरू करें</div>
    <div id="live-text"></div>

    <button id="demoBtn" class="btn-demo">⚡ बिना माइक के टेस्ट करें (Demo)</button>

    <div id="result" style="display:none;"></div>
</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const demoBtn = document.getElementById('demoBtn');
    const statusText = document.getElementById('status');
    const liveTextDiv = document.getElementById('live-text');
    const resultDiv = document.getElementById('result');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN'; // हिंदी
        recognition.continuous = true; // ऑटो बंद होना रोका गया
        recognition.interimResults = true; // लाइव सुनना चालू

        let isRecording = false;
        let finalTranscript = '';

        micBtn.onclick = () => {
            if (!isRecording) {
                finalTranscript = '';
                liveTextDiv.innerText = '';
                liveTextDiv.style.display = 'block';
                resultDiv.style.display = 'none';
                
                try {
                    recognition.start();
                    micBtn.classList.add('recording');
                    statusText.innerText = "सुन रहा हूँ... बोलना खत्म करके बटन दोबारा दबाएं!";
                    isRecording = true;
                } catch (e) {
                    console.error(e);
                }
            } else {
                recognition.stop();
                micBtn.classList.remove('recording');
                isRecording = false;
                statusText.innerText = "प्रोसेस हो रहा है...";
                
                if (finalTranscript.trim().length > 0) {
                    processText(finalTranscript);
                } else {
                    statusText.innerText = "कुछ आवाज़ सुनाई नहीं दी, दोबारा कोशिश करें।";
                }
            }
        };

        recognition.onresult = (event) => {
            let interim = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + ' ';
                } else {
                    interim += event.results[i][0].transcript;
                }
            }
            liveTextDiv.innerText = "लाइव आवाज़: " + (finalTranscript + interim);
        };

        recognition.onerror = (event) => {
            console.error(event.error);
            if (event.error !== 'no-speech') {
                statusText.innerText = "माइक एरर: " + event.error;
                micBtn.classList.remove('recording');
                isRecording = false;
            }
        };

        recognition.onend = () => {
            // अगर गलती से बंद हो जाए और रिकॉर्डिंग ऑन थी, तो री-स्टार्ट करें
            if (isRecording) {
                try { recognition.start(); } catch(e) {}
            }
        };

    } else {
        statusText.innerText = "आपका ब्राउज़र सपोर्ट नहीं करता। Android Chrome का इस्तेमाल करें।";
    }

    // Demo Button Handler
    demoBtn.onclick = () => {
        processText("रमेश कुमार के नाम 5 किलो आटा 40 रुपये और 2 लीटर तेल 140 रुपये लिखो");
    };

    // Send Text to Backend
    async function processText(text) {
        statusText.innerText = "बिल बनाया जा रहा है... ⏳";
        try {
            const response = await fetch('/api/test-billing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const resData = await response.json();
            
            if (resData.success) {
                statusText.innerText = "बिल बनकर तैयार है! 🎉";
                resultDiv.style.display = 'block';
                
                let billText = `📝 **बिल विवरण**\n👤 ग्राहक: ${resData.data.customer_name || 'N/A'}\n----------------\n`;
                resData.data.items.forEach(i => {
                    billText += `• ${i.item_name} (${i.quantity} ${i.unit}) @ ₹${i.rate} = ₹${i.total}\n`;
                });
                billText += `----------------\n💵 कुल: ₹${resData.data.grand_total}`;
                
                resultDiv.innerText = billText;
            } else {
                statusText.innerText = "प्रोसेसिंग एरर!";
            }
        } catch (e) {
            statusText.innerText = "सर्वर एरर!";
        }
    }
</script>

</body>
</html>
